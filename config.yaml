# iammiti99 — site configuration
# Single source of truth. build.js reads this and renders src/template.html
# into _site/index.html. Links flagged with `repo:` get live star + last-commit
# decorations from the GitHub REST API at build time.

site:
  title: "Tien — links"
  description: "Tien Nguyen Minh — engineer, builder, writer."
  url: "https://tiennm99.github.io/iammiti99"
  lang: "en"
  theme_color_light: "#f7f7f7"
  theme_color_dark: "#1b1b1e"

profile:
  name: "@miti99"
  tagline: "Engineer building things on the web."
  avatar: "./images/avatar.jpg"

# Optional. Leave empty string to disable.
analytics:
  google_analytics_id: ""

# Primary list — rendered as full-width buttons in order.
# Fields: text (required), url (required), icon (FA class), target, repo (owner/name)
# `repo:` triggers a GitHub API fetch and adds "★ N · Md ago" to the button.
links:
  - text: "GitHub"
    url: "https://github.com/tiennm99"
    icon: "fa-brands fa-github"
    target: "_blank"
  - text: "iammiti99"
    url: "https://github.com/tiennm99/iammiti99"
    icon: "fa-solid fa-link"
    target: "_blank"
    repo: "tiennm99/iammiti99"
  - text: "Email"
    url: "mailto:minhtienit99@gmail.com"
    icon: "fa-solid fa-envelope"
    target: "_self"

# Small icon row below the link buttons.
socials:
  - icon: "fa-brands fa-github"
    url: "https://github.com/tiennm99"
    title: "GitHub"
  - icon: "fa-solid fa-envelope"
    url: "mailto:minhtienit99@gmail.com"
    title: "Email"

footer:
  text: "Thanks for stopping by."
  copyright: "© 2026 Tien Nguyen Minh"
